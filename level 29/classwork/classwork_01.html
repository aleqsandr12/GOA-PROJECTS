<!-- შექნებით 3 ელემენტი: h1, p, button და შეუცვალეთ სამივეს  ზომა, ტექსტის ფერი, ფონის ფერი და border-ის ყველა თვისება თქვენი კრეატიულობით მაქსიმალურად დახვეწეთ დიზაინი-->
<!--კომენტარებით ახსენით რით განსხვავდება inline და block level ელემენტები, მოიყვანეთ მაგალითები და დაამტკიცეთ border და background color კუთვნილებების საშვალებით, საბოლოოდ კი გამოიტანეთ დასკვნა და დააჯგუფეთ თქვენთვის ცნობილი თეგები inline და block ელემენტებად-->
<!--inline - ელემენტი გაგრძელებს ბოლომდე სანამ ქვემოთ არ მოუწევს ქვემოთ ჩამოსვლა(ნაგულისხმებია ღილაკი/button)-->
<!--block level - ელემნტი კი ქვეით ჩამოაყოლებს სანამ მანამ არ დასრულდება ეს ღილაკები-->
<!--inline - მაგ -> -->


<button>1</button><button>1</button><button>1</button><button>1</button><button>1</button><button>1</button><button>1</button><button>1</button>
<!--block level - მაგ -> -->
<button>1</button> <br>
<button>1</button> <br>
<button>1</button> <br>
<button>1</button> <br>
<button>1</button> <br>
<button>1</button> <br>
<button>1</button> <br>
<button>1</button> <br>

<!-- დაამტკიცეთ border და background color კუთვნილებების საშვალებით(ვერგავიგე რა იგულესხმება აქ და ეს)
 საბოლოოდ კი გამოიტანეთ დასკვნა და დააჯგუფეთ თქვენთვის ცნობილი თეგები inline და block ელემენტებად-->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style = "color: red; font-size: 24px ; border: black solid 10px; background-color: blueviolet;">hello</h1>
    <p style = "color: red; font-size: 24px;  border: black solid 10px; background-color: blueviolet;">hello1</p>
    <button style = "color: red; font-size: 24px;  border: black solid 10px; background-color: blueviolet;">hello2</button>
</body>
</html>
