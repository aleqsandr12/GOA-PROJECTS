<!-- დავალება 5:

შექმენით HTML ფაილი, რომელშიც იქნება ორი პარაგრაფი.

დააკონფიგურირეთ CSS სტილი, სადაც ერთი სტილი ეფუძნება ID სელექტორს (მაგალითად #first), ხოლო მეორე - Class სელექტორს (მაგალითად .second).

დააკვირდით, რომ ID სელექტორი ყოველთვის უფრო მაღალი პრიორიტეტით მოქმედებს, ვიდრე Class სელექტორი. -->


<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>CSS პრიორიტეტი - ID vs Class</title>
  <style>
    /* ID სელექტორი */
    #first {
      color: blue;
      font-size: 20px;
      font-weight: bold;
    }

    /* Class სელექტორი */
    .second {
      color: green;
      font-size: 18px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <p id="first">
    ეს არის პირველი პარაგრაფი, რომელსაც აქვს ID (#first). ტექსტი იქნება ლურჯი, 20px და bold.
  </p>

  <p class="second">
    ეს არის მეორე პარაგრაფი, რომელსაც აქვს Class (.second). ტექსტი იქნება მწვანე, 18px და italic.
  </p>
</body>
</html>
