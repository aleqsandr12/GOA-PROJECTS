<!-- დავალება 3:

შექმენით HTML ფაილი, სადაც დაგეგმავთ რამდენიმე სტილის ჩაწერას:

წარწერა p ელემენტზე, რომელზეც გამოყენებული იქნება color და font-size.

ერთი წესი დაიწერება div ელემენტისთვის, და მეორე კი p ელემენტისთვის.

გააკეთეთ კავშირი CSS-თან და განსაზღვრეთ, რომელ სტილზე იქნება ყველაზე მაღალი პრიორიტეტი: p თუ div. -->


<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>CSS პრიორიტეტი - div vs p</title>
  <style>
    /* div სელექტორი */
    div {
      color: red;
      font-size: 16px;
    }

    /* p სელექტორი */
    p {
      color: blue;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <div>
    <p>ეს ტექსტი არის p ელემენტი div-ის შიგნით.</p>
  </div>

  <div>
    <p>ეს კიდევ ერთი p ელემენტი, რომელიც div-ის შიგნითა სტილებსთან ურთიერთობს.</p>
  </div>
</body>
</html>
