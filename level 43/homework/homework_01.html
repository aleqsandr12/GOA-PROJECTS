<!-- დავალება 1:

ახსენით CSS-ის პრიორიტეტი 

განიხილეთ, როგორ განსაზღვრავს CSS პრიორიტეტი, თუ როგორ აირჩევა სტილი, როცა სხვადასხვა წესი მოქმედებს ერთსა და იმავე ელემენტზე.

ახსენით, თუ რა განსხვავებაა ID, Class, Element, და Inline სელექტორებს შორის და როგორ მოქმედებს თითოეული პრიორიტეტზე. -->



<!-- Inline სტილები – ელემენტის style="" ატრიბუტში დაწერილი კოდი ყველაზე მაღალ პრიორიტეტს ფლობს. -->

<p style="color: red;">testing</p>


<!-- ID სელექტორები (#id) – საკმაოდ ძლიერი პრიორიტეტი აქვთ. ერთი ID სელექტორი უფრო ძლიერია, ვიდრე ბევრი class ან ელემენტი.

#title {
  color: blue;
}


Class სელექტორები (.class), ატრიბუტის სელექტორები ([type="text"]), და ფსევდო-კლასები (:hover, :first-child) – საშუალო პრიორიტეტი აქვთ.

.highlight {
  color: green;
}


ელემენტის სელექტორები (p, h1, div) და ფსევდო-ელემენტები (::before, ::after) – ყველაზე დაბალი პრიორიტეტი აქვთ.

p {
  color: black;
}


!important – თუ რომელიმე სტილს აქვს !important, ის გადაფარავს სხვებს (გარდა იმ შემთხვევისა, როცა ორივეს აქვს !important, მაშინ ისევ specificity იანგარიშება).

p {
  color: orange !important;
}

მაგალითი:

p { color: red; }         /* 1 ქულა */
.highlight { color: yellow; } /* 10 ქულა */
#title { color: green; }      /* 100 ქულა */


თუ ერთსა და იმავე <p> ელემენტზე ყველა ეს წესი ვრცელდება, ფერი იქნება ლურჯი, რადგან ID-ს აქვს ყველაზე მაღალი პრიორიტეტი. -->
