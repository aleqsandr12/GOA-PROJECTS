<!-- 1. რა არის პრიორიტეტი CSS-ში?

CSS-ში პრიორიტეტი ნიშნავს წესის ძალას ან სიძლიერეს, რომელიც განსაზღვრავს, რომელი სტილი ჩაირთვება, როდესაც ერთი ელემენტზე რამდენიმე წესი მოქმედებს.
მაგალითად, თუ გვაქვს ერთი ელემენტი <p> და მას მიენიჭა სტილი როგორც კლასით, ასევე ID-თი, მაშინ პრიორიტეტი განსაზღვრავს, რომელი სტილი გაიმარჯვებს.

2. რატომ შეიქმნა პრიორიტეტები?

პერიოდები იმიტომ შეიქმნა, რომ ვებ-გვერდზე ერთ ელემენტს შეიძლება რამდენიმე CSS წესი შეეხოს.
მაგალითად: -->

p { color: red; }        <!--სტანდარტული ელემენტი-->
.text { color: blue; }    <!--კლასის სტილი -->
#main { color: green; }   <!--ID-ის სტილი-->


<!-- თუ <p id="main" class="text">Hello</p> გვაქვს, კითხვაა: რომელი ფერი ჩაირთვება?
პასუხი არის მწვანე, რადგან ID-ის სტილი უფრო ძლიერი პრიორიტეტით გამოირჩევა კლასის და ელემენტის სტილებზე.

პრიორიტეტი შექმნილია, რათა გამოავლინოს რომელმა წესმა უნდა დაამკვიდროს სტილი, როცა კონფლიქტია.

3. CSS-ის პრიორიტეტების ტიპები

ელემენტის სელექტორი (element selector)

მაგალითი: p, div, h1

პრიორიტეტი ყველაზე დაბალია.

კლასის სელექტორი (class selector)

მაგალითი: .text, .active

ელემენტის სელექტორზე ძლიერი პრიორიტეტით გამოირჩევა.

ID სელექტორი (ID selector)

მაგალითი: #main, #header

უფრო ძლიერი პრიორიტეტითაა, ვიდრე კლასი ან ელემენტი.

ინლაინ სტილი (inline style)

პირდაპირ HTML ელემენტში ჩაწერილი სტილი:
<p style="color: yellow;">Hello</p>

აქვს ყველაზე მაღალი პრიორიტეტი ID-ის სტილზეც კი.

!important

მაგალითი: color: red !important;

თითქმის უძლიერესი პრიორიტეტია, მაგრამ გამოიყენება მხოლოდ აუცილებლობის შემთხვევაში.-->
