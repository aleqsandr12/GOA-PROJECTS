<!--შექმენი ცხრილი, სადაც პირველი სვეტი rowspan-ით გაერთიანდება 2 რიგზე.
მაგალითად: პირველ სვეტში წერია "მთის ცხოველები", ხოლო გვერდით — "დათვი" და "მგელი". -->
<!---->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="1">
        <tr>
            <th rowspan="2">მთსი ცხოველები</th>
            <th></th>
        </tr>
        <tr>
            <td>დათვი</td>               
            <td>მგელი</td>
        </tr>
    </table>
</body>
</html>
